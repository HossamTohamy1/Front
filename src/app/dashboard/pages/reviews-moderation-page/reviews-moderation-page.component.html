<app-admin-layout>
  <div class="max-w-3xl mx-auto space-y-5">
    <h1 class="font-display font-bold text-2xl">
      {{ 'DASHBOARD.AUTO_STR_172' | translate }}
    </h1>

    <div class="space-y-3">
      <div *ngFor="let r of reviews()" class="bg-card border rounded-2xl p-4 transition-all"
        [ngClass]="r.approved ? 'border-border' : 'border-amber-300 dark:border-amber-700'">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <div class="w-7 h-7 rounded-full bg-brand text-[#0E0E11] flex items-center justify-center text-xs font-bold shrink-0">
                {{ r.userName[0] }}
              </div>
              <span class="font-semibold text-sm">{{ r.userName }}</span>
              <span class="text-xs text-muted-foreground">{{ r.date }}</span>
            </div>
            <div class="flex gap-0.5 mb-1.5">
              <ng-container *ngFor="let i of getArray(5)">
                <lucide-icon [img]="Star" [size]="12" [class]="i < r.rating ? 'text-amber-400 fill-amber-400' : 'text-muted'"></lucide-icon>
              </ng-container>
            </div>
            <p class="text-sm text-muted-foreground">{{ r.comment }}</p>
            <p *ngIf="getProduct(r.productId) as product" class="text-xs text-brand mt-1.5">
              ↳ {{ lang() === 'ar' ? product.nameAr : product.nameEn }}
            </p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button
              (click)="toggleApprove(r.id)"
              class="h-8 px-3 rounded-xl text-xs font-medium flex items-center gap-1.5 transition-colors tap-highlight"
              [ngClass]="r.approved ? 'bg-green-100 dark:bg-green-900/20 text-green-700 dark:text-green-400 hover:bg-green-200' : 'bg-muted text-muted-foreground hover:bg-muted'"
            >
              <ng-container *ngIf="r.approved">
                <lucide-icon [img]="Eye" [size]="13"></lucide-icon>
                {{ 'DASHBOARD.AUTO_STR_439' | translate }}
              </ng-container>
              <ng-container *ngIf="!r.approved">
                <lucide-icon [img]="EyeOff" [size]="13"></lucide-icon>
                {{ 'DASHBOARD.AUTO_STR_460' | translate }}
              </ng-container>
            </button>
            <button class="h-8 px-3 rounded-xl bg-muted text-xs font-medium flex items-center gap-1.5 hover:bg-brand/10 hover:text-brand transition-colors tap-highlight">
              <lucide-icon [img]="MessageCircle" [size]="13"></lucide-icon>
              {{ 'DASHBOARD.AUTO_STR_440' | translate }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-admin-layout>
